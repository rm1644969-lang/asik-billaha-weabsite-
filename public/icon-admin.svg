        fill="#2a0808" stroke="#EF4444" stroke-width="24" stroke-linejoin="round"/>
        
  <!-- Admin Key / Star inside Shield -->
  <circle cx="256" cy="210" r="32" fill="#FACC15"/>
  <rect x="246" y="235" width="20" height="75" rx="6" fill="#FACC15"/>
  <rect x="256" y="270" width="24" height="14" rx="4" fill="#FACC15"/>
  <rect x="256" y="295" width="18" height="14" rx="4" fill="#FACC15"/>
