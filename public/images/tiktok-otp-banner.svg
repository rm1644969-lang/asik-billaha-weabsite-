<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="ttGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#fe0979" />
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="200" r="160" fill="#00f2fe" opacity="0.12" filter="blur(60px)"/>
  <circle cx="600" cy="220" r="160" fill="#fe0979" opacity="0.12" filter="blur(60px)"/>

  <!-- Mock App Window Card -->
  <rect x="120" y="70" width="560" height="310" rx="20" fill="#0f0f14" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="120" y="70" width="560" height="42" rx="20" fill="#161620"/>
  <circle cx="150" cy="91" r="5" fill="#EF4444"/>
  <circle cx="168" cy="91" r="5" fill="#FACC15"/>
  <circle cx="186" cy="91" r="5" fill="#10B981"/>
  <text x="400" y="96" fill="#888899" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">TIKTOK OTP RESENDER PRO &bull; v1.0</text>

  <!-- TikTok Note Icon -->
  <g transform="translate(180, 160) scale(1.6)">
    <!-- Cyan Shadow -->
    <path d="M38 12 C34 7 32 3 32 0 H24 V28 C24 33 20 37 15 37 C10 37 6 33 6 28 C6 23 10 19 15 19 C16 19 17 19.2 18 19.5 V11 C17 11 16 11 15 11 C5.6 11 -2 18.6 -2 28 C-2 37.4 5.6 45 15 45 C24.4 45 32 37.4 32 28 V15 C36 18 41 20 46 20 V12 C43 12 40 12 38 12 Z" fill="#00f2fe" opacity="0.8"/>
    <!-- Magenta Shadow -->
    <path d="M42 16 C38 11 36 7 36 4 H28 V32 C28 37 24 41 19 41 C14 41 10 37 10 32 C10 27 14 23 19 23 C20 23 21 23.2 22 23.5 V15 C21 15 20 15 19 15 C9.6 15 2 22.6 2 32 C2 41.4 9.6 49 19 49 C28.4 49 36 41.4 36 32 V19 C40 22 45 24 50 24 V16 C47 16 44 16 42 16 Z" fill="#fe0979" opacity="0.8"/>
    <!-- Main White -->
    <path d="M40 14 C36 9 34 5 34 2 H26 V30 C26 35 22 39 17 39 C12 39 8 35 8 30 C8 25 12 21 17 21 C18 21 19 21.2 20 21.5 V13 C19 13 18 13 17 13 C7.6 13 0 20.6 0 30 C0 39.4 7.6 47 17 47 C26.4 47 34 39.4 34 30 V17 C38 20 43 22 48 22 V14 C45 14 42 14 40 14 Z" fill="#ffffff"/>
  </g>

  <!-- Terminal Lines Mock -->
  <rect x="330" y="150" width="310" height="24" rx="6" fill="#1c1c28"/>
  <rect x="330" y="186" width="240" height="24" rx="6" fill="#1c1c28"/>
  <rect x="330" y="222" width="280" height="24" rx="6" fill="#1c1c28"/>
  <rect x="330" y="265" width="160" height="34" rx="8" fill="#252538"/>

  <!-- Centered Lock & Coming Soon Ribbon -->
  <rect x="250" y="325" width="300" height="38" rx="19" fill="#000000" fill-opacity="0.85" stroke="#FACC15" stroke-width="2"/>
  <text x="400" y="350" fill="#FACC15" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="3">🔒 COMING SOON</text>
</svg>
