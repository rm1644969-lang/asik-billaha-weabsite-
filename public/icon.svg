<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)" stroke="url(#borderGlow)" stroke-width="16"/>
  
  <!-- Terminal Prompt Icon -->
  <path d="M140 180 L230 256 L140 332" fill="none" stroke="#FACC15" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Cursor Line -->
  <line x1="260" y1="332" x2="370" y2="332" stroke="#EF4444" stroke-width="36" stroke-linecap="round"/>
  
  <!-- Lightning / Key Sparkle -->
  <polygon points="340,140 310,210 360,210 320,290 380,200 335,200 365,140" fill="#FACC15"/>
</svg>
